<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KROK Trainer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="components/sidebar.css" />
  <link rel="stylesheet" href="components/practice-shell.css" />
</head>
<body>
  <script>
    const pageParams = new URLSearchParams(window.location.search);
    if (pageParams.get("mode") !== "exam") {
      document.body.classList.add("practice-session");
    }
  </script>
  <aside id="appSidebar" data-root="" data-active="krok1-practice"></aside>
  <div class="sidebar-page-shell">
  <div class="quiz-container">
    <div class="top-bar">
        <div class="header-row">
            <h1 id="appTitle">KROK Trainer</h1>
            <div class="top-right-controls">
                <span class="version-text">v1.9 August 2026</span>
                <button id="theme-btn">🌙 Dark Mode</button>
            </div>
        </div>
        <div class="top-controls">
            <div class="controls">
                <label for="subjectFilter">Subject:</label>
                <select id="subjectFilter"><option value="all">All Subjects</option></select>
            </div>
            <button id="homeBtn" class="button"><span id="homeBtnText">Home</span></button>
            <button id="stats-btn" class="hidden-old-stats"> Stats</button>
            <button onclick="window.location.href='guide.html'"> Tutorial</button>
        </div>
    </div>
    <div id="examTimer" class="exam-timer" style="display: none;">⏱ <span id="examTimerText">00:00:00</span></div>
    <div class="progress-container"><div id="progressBar" class="progress-bar"></div></div>
    <div class="quiz-card">
      <div class="question-header">
        <div class="question-meta"><p id="question-number">Question 1</p><p id="subject-display">Subject: -</p></div>
        <button id="aiExplainBtn" class="ai-explain-btn" type="button" style="display: none;">✨ AI Explain</button>
      </div>
      <div id="aiExplanationBox" class="ai-explanation-box" style="display: none;">
        <div class="ai-explanation-header"><span>✨ AI Explanation</span><button id="closeAiExplanation" class="ai-close-btn" type="button" aria-label="Close AI explanation">×</button></div>
        <div id="aiExplanationContent">Loading explanation...</div>
      </div>
      <h2 id="question-text">Question text</h2>
      <div id="answers-container"></div>
      <button id="confirmAnswerBtn" class="primary-actions" type="button" style="display: none;">Confirm Answer</button>
      <button id="next-btn" class="primary-actions">Next question</button>
    </div>
    <p id="feedback"></p>
    <div id="practice-tools">
      <p id="score">Score: 0</p><p id="stats">Correct: 0 | Wrong: 0 | Accuracy: 0%</p><hr><p id="error-count">Errors: 0</p>
      <ul id="error-log" style="display: none;"></ul>
      <div class="action-buttons"><div class="export-actions"><button id="review-btn">Review mistakes</button><button id="export-errors-btn">Export Error Log</button><button id="exportExamLogBtn" class="button">Export Exam Log</button><button id="reviewExamBtn" class="button" style="display: none;">Review Exam</button></div></div>
      <div class="danger-zone"><button id="clear-errors-btn">Clear Error Log</button></div>
    </div>
    <div class="review-navigation"><button id="prevReviewBtn" class="button" style="display: none;">⬅️ Previous</button><button id="nextReviewBtn" class="button" style="display: none;">Next ➡️</button></div>
  </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
  <script src="exam-subjects.js"></script>
  <script src="components/practice-shell.js"></script>
  <script>
    const practiceSidebar = document.getElementById("appSidebar");
    if (practiceSidebar) {
      const practiceParams = new URLSearchParams(window.location.search);
      practiceSidebar.dataset.active = practiceParams.get("exam") === "krok2" ? "krok2-practice" : "krok1-practice";
    }
  </script>
  <script src="components/sidebar.js"></script>
</body>
</html>
