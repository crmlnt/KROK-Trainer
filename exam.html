<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KROK Exam | KROK Trainer</title>

  <link rel="stylesheet" href="exam.css">
</head>

<body>

  <main class="exam-wrapper">

    <section class="exam-container">

      <div class="exam-header">
        <span id="examLabel" class="exam-label">KROK 1</span>

        <h1>Exam Simulation</h1>

        <p>
          Configure your mock exam and test your preparation.
        </p>
      </div>


      <div class="exam-panel">

        <div class="exam-section">

          <h2>Select Topic</h2>
          <div id="topicOptions">

          <label class="option-row">
            <input type="radio" name="topic" value="all" checked>
            <span>All Topics</span>
          </label>

          <label class="option-row">
            <input type="radio" name="topic" value="normal-physiology">
            <span>Normal Physiology</span>
          </label>

          <label class="option-row">
            <input type="radio" name="topic" value="pathophysiology">
            <span>Pathophysiology</span>
          </label>

          <label class="option-row">
            <input type="radio" name="topic" value="pathomorphology">
            <span>Pathomorphology</span>
          </label>

          <label class="option-row">
            <input type="radio" name="topic" value="pharmacology">
            <span>Pharmacology</span>
          </label>

          <label class="option-row">
            <input type="radio" name="topic" value="histology">
            <span>Histology</span>
          </label>
          </div>

        </div>


        <div class="exam-section">

          <h2>Number of Questions</h2>

          <div class="question-options">

            <label class="question-card">
              <input type="radio" name="questions" value="10" checked>
              <span>10</span>
            </label>

            <label class="question-card">
              <input type="radio" name="questions" value="50">
              <span>50</span>
            </label>

            <label class="question-card">
              <input type="radio" name="questions" value="150">
              <span>150</span>
            </label>

            <label class="question-card">
              <input type="radio" name="questions" value="200">
              <span>200</span>
            </label>

          </div>

        </div>


        <button id="startExamBtn" class="start-button">
          Start Exam
        </button>

      </div>


      <a id="backLink" href="krok1.html" class="back-link">
        ← Back to study mode
      </a>

    </section>

  </main>


  <script>
  const params = new URLSearchParams(window.location.search);
  const examType = params.get("exam") || "krok1";

  const startExamBtn =
    document.getElementById("startExamBtn");

  const examLabel =
    document.getElementById("examLabel");

  const topicOptions =
    document.getElementById("topicOptions");

  const backLink =
    document.getElementById("backLink");


  // ==========================================
  // KROK 2 CONFIGURATION
  // ==========================================

  if (examType === "krok2") {

    document.title =
      "KROK 2 Exam | KROK Trainer";

    examLabel.textContent = "KROK 2";

    backLink.href = "krok2.html";


    const krok2Subjects = [
      "Anesthesiology and Emergency Medicine",
      "Children's Infectious Diseases",
      "Dermatology",
      "Forensic Medicine",
      "Hygiene",
      "Infectious Diseases",
      "Internal Medicine",
      "Neurology",
      "Obstetrics and Gynecology",
      "Occupational Diseases",
      "Oncology",
      "Ophthalmology",
      "Otorhinolaryngology",
      "Pediatric Surgery",
      "Pediatrics",
      "Phthisiology",
      "Psychiatry",
      "Social Medicine",
      "Surgery",
      "Traumatology",
      "Urology"
    ];


    topicOptions.innerHTML = `
      <label class="option-row">
        <input
          type="radio"
          name="topic"
          value="all"
          checked
        >
        <span>All Topics</span>
      </label>
    `;


    krok2Subjects.forEach(subject => {

      const label =
        document.createElement("label");

      label.className = "option-row";


      const input =
        document.createElement("input");

      input.type = "radio";
      input.name = "topic";
      input.value = subject;


      const span =
        document.createElement("span");

      span.textContent = subject;


      label.appendChild(input);
      label.appendChild(span);

      topicOptions.appendChild(label);
    });

  } else {

    document.title =
      "KROK 1 Exam | KROK Trainer";

    examLabel.textContent = "KROK 1";

    backLink.href = "krok1.html";
  }


  // ==========================================
  // START EXAM
  // ==========================================

  startExamBtn.addEventListener("click", () => {

    const topic =
      document.querySelector(
        'input[name="topic"]:checked'
      ).value;

    const questions =
      document.querySelector(
        'input[name="questions"]:checked'
      ).value;


    const nextParams =
      new URLSearchParams();

    nextParams.set("mode", "exam");
    nextParams.set("topic", topic);
    nextParams.set("questions", questions);

    if (examType === "krok2") {
      nextParams.set("exam", "krok2");
    }


    window.location.href =
      `exam-instructions.html?${nextParams.toString()}`;

  });
</script>

</body>
</html>
